server {
    listen 3007;

    # Log real client IP from Cloudflare CF-Connecting-IP header
    access_log /var/log/nginx/client-ip-table-secret cf_ip;

    # 301 redirect URL cũ -> URL mới (giữ thứ hạng SEO)
    location = /thanh-ly-quan-bar-tphcm { return 301 https://thumuadocutrungkien.com/thanh-ly-quan-bar-tron-goi-tphcm; }
    location = /thanh-ly-quan-bar-tai-q1 { return 301 https://thumuadocutrungkien.com/thanh-ly-quan-bar-tai-quan-1; }
    location = /thanh-ly-quan-karaoke-tai-q1 { return 301 https://thumuadocutrungkien.com/thanh-ly-quan-karaoke-tai-quan-1; }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Serve IP log file as a downloadable CSV at this URL
    location = /client-ip-table-secret {
        alias /var/log/nginx/client-ip-table-secret;
        add_header Content-Type 'text/plain; charset=UTF-8';
        add_header Content-Disposition 'attachment; filename="client-ip-table-secret.csv"';
        add_header Cache-Control 'no-store, no-cache';
    }
}
